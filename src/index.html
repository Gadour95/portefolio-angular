    <script>
      (function () {
        try {
          var theme = localStorage.getItem('siw-theme');
          var validTheme =
            theme === 'light' || theme === 'dark' || theme === 'system';

          if (!validTheme) {
            theme = 'system';
          }

          var dark =
            theme === 'dark' ||
            (
              theme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches
            );

          document.documentElement.classList.toggle('app-dark', dark);

          var language = localStorage.getItem('siw-language');

          if (
            language === 'fr' ||
            language === 'en' ||
            language === 'ar'
          ) {
            document.documentElement.lang = language;
            document.documentElement.dir =
              language === 'ar' ? 'rtl' : 'ltr';
          }
        } catch (error) {
          document.documentElement.classList.toggle(
            'app-dark',
            window.matchMedia('(prefers-color-scheme: dark)').matches
          );
        }
      })();
    </script>
