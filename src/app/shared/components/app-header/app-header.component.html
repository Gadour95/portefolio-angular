<header
  class="sticky top-0 z-40 border-b
         border-[var(--app-border)]
         bg-[var(--app-surface)]
         shadow-[0_4px_24px_-20px_rgba(15,23,42,0.45)]"
>
  <div
    class="app-container flex min-h-20
           items-center justify-between gap-3"
  >
    <!-- Identité -->

    <a
      [routerLink]="homePath()"
      class="flex shrink-0 items-center gap-3"
      [attr.aria-label]="'app.name' | translate"
    >
      <span
        class="flex h-11 w-11 items-center justify-center
               rounded-2xl bg-gradient-to-br
               from-indigo-600 to-blue-600 text-white
               shadow-lg shadow-indigo-600/20"
      >
        <i
          class="pi pi-shopping-bag text-xl"
          aria-hidden="true"
        ></i>
      </span>

      <span class="hidden flex-col sm:inline-flex">
        <span class="text-xl font-bold leading-6 tracking-tight">
          SIW<span class="text-primary">.</span>
        </span>

        <span class="text-[11px] font-medium tracking-wide app-muted">
          E-COMMERCE
        </span>
      </span>
    </a>

    <!-- Actions -->

    <div class="flex items-center gap-1 sm:gap-2">
      <!-- Langue -->

      <p-button
        type="button"
        icon="pi pi-language"
        severity="secondary"
        styleClass="siw-icon-button"
        [ariaLabel]="'preferences.language' | translate"
        [pTooltip]="'preferences.language' | translate"
        tooltipPosition="bottom"
        (onClick)="togglePopup(languageMenu, $event)"
      />

      <!-- Apparence -->

      <p-button
        type="button"
        [icon]="themeIcon()"
        severity="secondary"
        styleClass="siw-icon-button"
        [ariaLabel]="'preferences.theme' | translate"
        [pTooltip]="'preferences.theme' | translate"
        tooltipPosition="bottom"
        (onClick)="togglePopup(themeMenu, $event)"
      />

      <!-- Panier : nécessite CLIENT -->

      @if (auth.isClient()) {
        <p-button
          type="button"
          icon="pi pi-shopping-cart"
          severity="secondary"
          styleClass="siw-icon-button"
          [ariaLabel]="'auth.cart' | translate"
          [pTooltip]="'auth.cart' | translate"
          tooltipPosition="bottom"
          (onClick)="openCart()"
        />
      }

      <span
        class="mx-1 h-6 w-px bg-[var(--app-border)]"
        aria-hidden="true"
      ></span>

      <!-- Compte ou connexion -->

      @if (auth.authenticated()) {
        <p-button
          type="button"
          icon="pi pi-user"
          severity="secondary"
          styleClass="siw-icon-button siw-account-button"
          [ariaLabel]="accountLabel()"
          [pTooltip]="accountLabel()"
          tooltipPosition="bottom"
          [disabled]="authBusy()"
          (onClick)="togglePopup(accountMenu, $event)"
        />
      } @else {
        <p-button
          type="button"
          icon="pi pi-sign-in"
          severity="secondary"
          styleClass="siw-icon-button siw-account-button"
          [ariaLabel]="'auth.login' | translate"
          [pTooltip]="'auth.login' | translate"
          tooltipPosition="bottom"
          [loading]="authBusy()"
          [disabled]="authBusy()"
          (onClick)="login()"
        />
      }
    </div>
  </div>

  <div
    class="h-px bg-gradient-to-r
           from-transparent via-indigo-500/30 to-transparent"
    aria-hidden="true"
  ></div>
</header>

<!-- Menus déroulants -->

<p-menu
  #languageMenu
  id="siw-language-menu"
  [model]="languageItems()"
  [popup]="true"
  [baseZIndex]="1100"
  [ariaLabel]="'preferences.language' | translate"
  appendTo="body"
  styleClass="siw-popup-menu"
/>

<p-menu
  #themeMenu
  id="siw-theme-menu"
  [model]="themeItems()"
  [popup]="true"
  [baseZIndex]="1100"
  [ariaLabel]="'preferences.theme' | translate"
  appendTo="body"
  styleClass="siw-popup-menu"
/>

<p-menu
  #accountMenu
  id="siw-account-menu"
  [model]="accountItems()"
  [popup]="true"
  [baseZIndex]="1100"
  [ariaLabel]="'header.account' | translate"
  appendTo="body"
  styleClass="siw-popup-menu"
/>
