<header
  class="sticky top-0 z-40 border-b border-[var(--app-border)]
         bg-[var(--app-surface)]"
>
<div class="border-t border-[var(--app-border)]">
  <div class="app-container py-3">
    <app-auth-actions />
  </div>
</div>

  <div class="app-container flex min-h-20 items-center justify-between gap-4">
    <a
      routerLink="/"
      class="flex shrink-0 items-center gap-3"
      (click)="closeMenu()"
      [attr.aria-label]="'app.name' | translate"
    >
      <span
        class="flex h-11 w-11 items-center justify-center rounded-xl
               bg-gradient-to-br from-indigo-600 to-blue-600 text-white
               shadow-lg shadow-indigo-600/20"
      >
        <i class="pi pi-shopping-bag text-xl" aria-hidden="true"></i>
      </span>

      <span class="text-lg font-bold tracking-tight">
        SIW<span class="text-primary">.</span>
      </span>
    </a>

    <nav class="hidden items-center gap-2 md:flex"
         [attr.aria-label]="'nav.main' | translate">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="app-nav-link"
      >
        {{ 'nav.showcase' | translate }}
      </a>

      <a
        routerLink="/admin-preview"
        routerLinkActive="active"
        class="app-nav-link"
      >
        {{ 'nav.adminPreview' | translate }}
      </a>
    </nav>

    <div class="flex items-center gap-2">
      <label for="language" class="sr-only">
        {{ 'preferences.language' | translate }}
      </label>

      <select
        id="language"
        class="app-control max-w-28 text-sm"
        [value]="languageService.current()"
        (change)="changeLanguage($event)"
      >
        <option value="fr">Français</option>
        <option value="en">English</option>
        <option value="ar">العربية</option>
      </select>

      <label for="theme" class="sr-only">
        {{ 'preferences.theme' | translate }}
      </label>

      <select
        id="theme"
        class="app-control max-w-28 text-sm"
        [value]="themeService.mode()"
        (change)="changeTheme($event)"
      >
        <option value="light">{{ 'preferences.light' | translate }}</option>
        <option value="dark">{{ 'preferences.dark' | translate }}</option>
        <option value="system">{{ 'preferences.system' | translate }}</option>
      </select>

      <button
        type="button"
        class="app-control flex items-center justify-center md:hidden"
        [attr.aria-label]="'nav.toggle' | translate"
        [attr.aria-expanded]="mobileMenuOpen()"
        aria-controls="mobile-navigation"
        (click)="toggleMenu()"
      >
        <i
          [class]="mobileMenuOpen() ? 'pi pi-times' : 'pi pi-bars'"
          aria-hidden="true"
        ></i>
      </button>
    </div>
  </div>

  @if (mobileMenuOpen()) {
    <nav
      id="mobile-navigation"
      class="app-container flex flex-col gap-2 pb-4 md:hidden"
      [attr.aria-label]="'nav.main' | translate"
    >
      <a routerLink="/" class="app-nav-link" (click)="closeMenu()">
        {{ 'nav.showcase' | translate }}
      </a>

      <a
        routerLink="/admin-preview"
        class="app-nav-link"
        (click)="closeMenu()"
      >
        {{ 'nav.adminPreview' | translate }}
      </a>
    </nav>
  }
</header>
