<header
  class="sticky top-0 z-40 border-b
         border-[var(--app-border)]
         bg-[var(--app-surface)]
         shadow-[0_4px_24px_-20px_rgba(15,23,42,0.45)]"
>
  <div class="app-container siw-header-content">
    <a
      routerLink="/"
      class="siw-header-brand"
      [attr.aria-label]="'app.name' | translate"
    >
      <span class="siw-header-brand-icon">
        <i
          class="pi pi-briefcase"
          aria-hidden="true"
        ></i>
      </span>

      <span class="siw-header-brand-copy">
        <span class="siw-header-brand-name">
          Portefolio<span class="text-primary">.</span>
        </span>

        <span class="siw-header-brand-caption">
          {{ 'app.tagline' | translate }}
        </span>
      </span>
    </a>

    <nav
      class="siw-main-nav"
      [attr.aria-label]="'nav.main' | translate"
    >
      <a
        routerLink="/"
        routerLinkActive="siw-main-nav-link-active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="siw-main-nav-link"
      >
        {{ 'nav.home' | translate }}
      </a>

      <a
        routerLink="/projects"
        routerLinkActive="siw-main-nav-link-active"
        class="siw-main-nav-link"
      >
        {{ 'nav.projects' | translate }}
      </a>

      <a
        routerLink="/services"
        routerLinkActive="siw-main-nav-link-active"
        class="siw-main-nav-link"
      >
        {{ 'nav.services' | translate }}
      </a>

      <a
        routerLink="/"
        fragment="contact"
        class="siw-main-nav-link"
      >
        {{ 'nav.contact' | translate }}
      </a>

      <a
        routerLink="/cv"
        routerLinkActive="siw-main-nav-link-active"
        class="siw-main-nav-link"
      >
        {{ 'nav.cv' | translate }}
      </a>

      @if (auth.isAdmin()) {
        <a
          routerLink="/admin/dashboard"
          routerLinkActive="siw-main-nav-link-active"
          class="siw-main-nav-link"
        >
          {{ 'nav.admin' | translate }}
        </a>
      }
    </nav>

    <div class="siw-header-actions">
      <!-- Langue -->

      <p-button
        type="button"
        icon="pi pi-language"
        severity="secondary"
        styleClass="siw-icon-button"
        [ariaLabel]="'preferences.language' | translate"
        [pTooltip]="'preferences.language' | translate"
        tooltipPosition="bottom"
        (onClick)="togglePopup(languageMenu, $event)"
      />

      <!-- Apparence -->

      <p-button
        type="button"
        [icon]="themeIcon()"
        severity="secondary"
        styleClass="siw-icon-button"
        [ariaLabel]="'preferences.theme' | translate"
        [pTooltip]="'preferences.theme' | translate"
        tooltipPosition="bottom"
        (onClick)="togglePopup(themeMenu, $event)"
      />

      <!-- Séparation -->

      <span
        class="mx-1 h-6 w-px bg-[var(--app-border)]"
        aria-hidden="true"
      ></span>

      <!-- Compte ou connexion -->

      @if (auth.authenticated()) {
        <p-button
          type="button"
          icon="pi pi-user"
          severity="secondary"
          styleClass="siw-icon-button siw-account-button"
          [ariaLabel]="accountLabel()"
          [pTooltip]="accountLabel()"
          tooltipPosition="bottom"
          [disabled]="authBusy()"
          (onClick)="togglePopup(accountMenu, $event)"
        />
      } @else {
        <p-button
          type="button"
          icon="pi pi-sign-in"
          severity="secondary"
          styleClass="siw-icon-button siw-account-button"
          [ariaLabel]="'auth.login' | translate"
          [pTooltip]="'auth.login' | translate"
          tooltipPosition="bottom"
          [loading]="authBusy()"
          [disabled]="authBusy()"
          (onClick)="login()"
        />
      }
    </div>
  </div>

  <!-- Ligne décorative -->

  <div
    class="h-px bg-gradient-to-r
           from-transparent via-indigo-500/30 to-transparent"
    aria-hidden="true"
  ></div>
</header>

<!-- Menu des langues -->

<p-menu
  #languageMenu
  id="siw-language-menu"
  [model]="languageItems()"
  [popup]="true"
  [baseZIndex]="1100"
  [ariaLabel]="'preferences.language' | translate"
  appendTo="body"
  styleClass="siw-popup-menu"
/>

<!-- Menu d’apparence -->

<p-menu
  #themeMenu
  id="siw-theme-menu"
  [model]="themeItems()"
  [popup]="true"
  [baseZIndex]="1100"
  [ariaLabel]="'preferences.theme' | translate"
  appendTo="body"
  styleClass="siw-popup-menu"
/>

<!-- Menu du compte -->

<p-menu
  #accountMenu
  id="siw-account-menu"
  [model]="accountItems()"
  [popup]="true"
  [baseZIndex]="1100"
  [ariaLabel]="'header.account' | translate"
  appendTo="body"
  styleClass="siw-popup-menu"
/>
